<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday To Sarun 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffe6eb 0%, #ffb6c1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 90%;
        }
        /* ปุ่มรูปเค้กหน้าแรก */
        .cake-wrapper {
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .cake-wrapper:hover {
            transform: scale(1.08);
        }
        .cake-img {
            width: 200px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(255, 107, 129, 0.4));
            animation: floatCake 2.5s infinite ease-in-out;
        }
        @keyframes floatCake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* การ์ดอวยพร */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }
        .card.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 20px;
            object-fit: cover;
            border: 4px solid #ff6b81;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3);
        }
        h1 {
            color: #ff4757;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            transition: background 0.3s;
        }
        .btn:hover {
            background: #ff4757;
        }

        /* หัวใจและเค้กลอย */
        .floating-heart {
            position: fixed;
            animation: floatUp 4s linear infinite;
            opacity: 0;
            z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
        <!-- เปลี่ยนจากซองจดหมายเป็นปุ่มเค้กวันเกิด -->
        <div class="cake-wrapper" id="cakeWrapper" onclick="openCard()">
            <img src="file:///C:/Users/piyanat.ya_bizconex/Downloads/%E2%80%94Pngtree%E2%80%94birthday%20cake%203d_18671752.png" alt="เค้กวันเกิด" class="cake-img">
            <p style="margin-top: 15px; color: #ff4757; font-weight: bold; font-size: 1.1rem;">
                ลองกดที่เค้กดูสิครับ 🎂✨
            </p>
        </div>

        <!-- การ์ดข้อความอวยพร -->
        <div class="card" id="birthdayCard">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Birthday%20Cake.png" alt="เค้กวันเกิด 3D" class="profile-img">
            
            <h1>Happy Birthday นะครับ 🎂✨</h1>
            
            <p>
                ขอให้มีความสุขมากๆ ในวันเกิดปีนี้นะครับ
                สุขภาพร่างกายแข็งแรง รวยๆเฮงๆ ปราศจากโรคภัยไข้เจ็บ
                จงมีแต่ความสุข การงานราบรื่น การเรียนขอให้ผ่านพ้นไปด้วยดี
                ขอให้ปีนี้เป็นปีที่ดี มีแต่เรื่องดีๆ เข้ามานะครับ 
                ❤️🥰
            </p>

            <button class="btn" onclick="createHearts()">กดรับเค้กกก 💖</button>
        </div>
    </div>

    <script>
        function openCard() {
            const cakeWrapper = document.getElementById('cakeWrapper');
            const card = document.getElementById('birthdayCard');

            cakeWrapper.style.display = 'none';
            card.classList.add('show');
            
            startHeartEffect();
            createHearts();
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            // สุ่มหัวใจ เค้ก และประกายดาว
            const icons = ['💖', '🎂', '💕', '🍰', '✨', '🧁'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 12 + 18) + 'px';
            heart.style.animationDuration = Math.random() * 2 + 2.5 + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        function startHeartEffect() {
            setInterval(createHeart, 350);
        }

        function createHearts() {
            for(let i = 0; i < 18; i++) {
                setTimeout(createHeart, i * 90);
            }
        }
    </script>
</body>
</html>
