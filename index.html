<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ข้อความพรีวิวเวลาส่งลิงก์ใน LINE -->
    <title>Happy Birthday To Sarun 🎂💖</title>
    <meta property="og:title" content="Happy Birthday To Sarun 🎂💖">
    <meta property="og:description" content="มีของขวัญเค้กวันเกิดสุดพิเศษมาให้ ลองกดเข้ามาดูสิครับ 🎁✨">
    <meta property="og:image" content="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #ffe6eb 0%, #ffb6c1 60%, #ff8fa3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ฉากหลังเอฟเฟกต์ดาววิ้งๆ ลอยกระจาย */
        #sparkleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        
        /* โครงสร้างปุ่มเค้กวันเกิด 3D */
        .cake-wrapper {
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cake-wrapper:hover {
            transform: scale(1.06);
        }
        
        /* รูปเค้กพร้อมเงาลอยแบบ 3D */
        .cake-img {
            width: 100%;
            max-width: 360px;
            height: auto;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(255, 71, 87, 0.35), 0 0 30px rgba(255, 255, 255, 0.6);
            animation: floatGlow 3.5s infinite ease-in-out;
        }

        /* เอฟเฟกต์เค้กลอยดุ๊กดิ๊กนุ่มนวล + แสงเรืองรอบๆ */
        @keyframes floatGlow {
            0%, 100% { 
                transform: translateY(0);
                filter: drop-shadow(0 10px 15px rgba(255, 107, 129, 0.4)) brightness(1);
            }
            50% { 
                transform: translateY(-12px);
                filter: drop-shadow(0 25px 25px rgba(255, 71, 87, 0.5)) brightness(1.08);
            }
        }

        /* การ์ดอวยพร */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: none;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card.show {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .profile-img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 20px;
            border: 4px solid #ff6b81;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.3);
        }
        h1 {
            color: #ff4757;
            font-size: 1.8rem;
            margin-bottom: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        p {
            color: #444;
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6);
        }

        /* หัวใจลอย */
        .floating-heart {
            position: fixed;
            animation: floatUp 4s linear infinite;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- พื้นหลังเอฟเฟกต์ละอองดาวกะพริบวิ้งๆ -->
    <canvas id="sparkleCanvas"></canvas>

    <div class="container">
        <!-- หน้าเค้กวันเกิด 3D หน้าแรก -->
        <div class="cake-wrapper" id="cakeWrapper" onclick="openCard()">
            <img src="cake.mp4" alt="เค้กวันเกิด 3D" class="cake-img" onerror="this.src='https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800'">
            <p style="margin-top: 18px; color: #ff4757; font-weight: bold; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(255,255,255,0.8);">
                ลองกดที่เค้กดูสิครับ 🎂✨
            </p>
        </div>

        <!-- การ์ดข้อความอวยพร -->
        <div class="card" id="birthdayCard">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800" alt="เค้กวันเกิด" class="profile-img">
            
            <h1>Happy Birthday นะครับ 🎂✨</h1>
            
            <p>
                ขอให้มีความสุขมากๆ ในวันเกิดปีนี้นะครับ
                สุขภาพร่างกายแข็งแรง รวยๆเฮงๆ ปราศจากโรคภัยไข้เจ็บ
                จงมีแต่ความสุข การงานราบรื่น การเรียนขอให้ผ่านพ้นไปด้วยดี
                ขอให้ปีนี้เป็นปีที่ดี มีแต่เรื่องดีๆ เข้ามานะครับ 
                ❤️🥰
            </p>

            <button class="btn" onclick="createHearts()">กดรับเค้กกก 💖</button>
        </div>
    </div>

    <script>
        // 1. ระบบสร้างเอฟเฟกต์ละอองดาววิบวับลอยกระจายเต็มจอ (Sparkles/Glitter)
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -0.8 - 0.2;
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.y += this.speedY;
                this.opacity -= this.fadeSpeed;
                if (this.opacity <= 0 || this.y < 0) {
                    this.reset();
                    this.y = canvas.height;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#fff';
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) {
            particles.push(new Particle());
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // 2. ระบบเปิดการ์ดอวยพรเมื่อกดที่เค้ก
        function openCard() {
            const cakeWrapper = document.getElementById('cakeWrapper');
            const card = document.getElementById('birthdayCard');

            cakeWrapper.style.transform = 'scale(0.8)';
            cakeWrapper.style.opacity = '0';
            
            setTimeout(() => {
                cakeWrapper.style.display = 'none';
                card.classList.add('show');
                startHeartEffect();
                createHearts();
            }, 400);
        }

        // 3. ระบบหัวใจและเค้กจิ๋วลอยขึ้นฟ้า
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            const icons = ['💖', '🎂', '✨', '💕', '🧁', '⭐'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 14 + 18) + 'px';
            heart.style.animationDuration = Math.random() * 2 + 2.5 + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4500);
        }

        function startHeartEffect() {
            setInterval(createHeart, 300);
        }

        function createHearts() {
            for(let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 80);
            }
        }
    </script>
</body>
</html>
