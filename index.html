<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ข้อความพรีวิวเวลาส่งลิงก์ใน LINE -->
    <title>Happy Birthday To Sarun 🎂💖</title>
    <meta property="og:title" content="Happy Birthday To Sarun 🎂💖">
    <meta property="og:description" content="มีของขวัญเค้กวันเกิดน่ารักๆ มาให้ ลองกดเข้ามาดูสิครับ 🎁✨">
    <meta property="og:image" content="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #ffe6eb 0%, #ffb6c1 60%, #ff8fa3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas ฉากหลังวิ้งๆ สไตล์ TikTok */
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        
        /* สไตล์และการเคลื่อนไหวของปุ่มวิดีโอเค้ก */
        .cake-wrapper {
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cake-wrapper:hover {
            transform: scale(1.06);
        }
        .cake-video {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 71, 87, 0.35), 0 0 25px rgba(255, 255, 255, 0.6);
            object-fit: cover;
            animation: floatGlow 3.5s infinite ease-in-out;
        }

        @keyframes floatGlow {
            0%, 100% { 
                transform: translateY(0);
                filter: brightness(1);
            }
            50% { 
                transform: translateY(-10px);
                filter: brightness(1.08);
            }
        }

        /* การ์ดอวยพร */
        .card {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }
        .card.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .profile-video {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 20px;
            border: 4px solid #ff6b81;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3);
            object-fit: cover;
        }
        h1 {
            color: #ff4757;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #444;
            line-height: 1.6;
            font-size: 1.05rem;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.6);
        }

        /* หัวใจและเค้กลอย */
        .floating-heart {
            position: fixed;
            animation: floatUp 4s linear infinite;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ฉากหลังเอฟเฟกต์ละอองดาวกะพริบวิ้งๆ -->
    <canvas id="sparkleCanvas"></canvas>

    <div class="container">
        <!-- ปุ่มเค้กวันเกิดหน้าแรก (ดึงไฟล์วิดีโอ MP4) -->
        <div class="cake-wrapper" id="cakeWrapper" onclick="openCard()">
            <video id="cakeVideo1" autoplay loop muted playsinline class="cake-video">
                <source src="A vibrant animated 3D-rendered birthday cake.mp4" type="video/mp4">
            </video>
            <p style="margin-top: 15px; color: #ff4757; font-weight: bold; font-size: 1.15rem; text-shadow: 0 2px 4px rgba(255,255,255,0.8);">
                ลองกดที่เค้กดูสิครับ 🎂✨
            </p>
        </div>

        <!-- การ์ดข้อความอวยพร -->
        <div class="card" id="birthdayCard">
            <video id="cakeVideo2" autoplay loop muted playsinline class="profile-video">
                <source src="A vibrant animated 3D-rendered birthday cake.mp4" type="video/mp4">
            </video>
            
            <h1>Happy Birthday นะครับ 🎂✨</h1>
            
            <p>
                ขอให้มีความสุขมากๆ ในวันเกิดปีนี้นะครับ
                สุขภาพร่างกายแข็งแรง รวยๆเฮงๆ ปราศจากโรคภัยไข้เจ็บ
                จงมีแต่ความสุข การงานราบรื่น การเรียนขอให้ผ่านพ้นไปด้วยดี
                ขอให้สอบผ่านได้โดยง่ายยยย มีแต่เรื่องดีๆ เข้ามานะครับ 
                ❤️🥰
            </p>

            <button class="btn" onclick="createHearts()">กดรับเค้กกก 💖</button>
        </div>
    </div>

    <script>
        // 1. ระบบบังคับวิดีโอเล่นอัตโนมัติ (Autoplay Fix)
        window.addEventListener('DOMContentLoaded', () => {
            const v1 = document.getElementById('cakeVideo1');
            const v2 = document.getElementById('cakeVideo2');
            [v1, v2].forEach(v => {
                if (v) {
                    v.muted = true;
                    v.play().catch(e => console.log("Autoplay blocked:", e));
                }
            });
        });

        // 2. เอฟเฟกต์ละอองดาวระยิบระยับเต็มหน้าจอ (Sparkles)
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 1;
                this.speedY = Math.random() * -0.6 - 0.2;
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.y += this.speedY;
                this.opacity -= this.fadeSpeed;
                if (this.opacity <= 0 || this.y < 0) {
                    this.reset();
                    this.y = canvas.height;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#fff';
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // 3. ฟังก์ชันเปิดการ์ด
        function openCard() {
            const cakeWrapper = document.getElementById('cakeWrapper');
            const card = document.getElementById('birthdayCard');

            cakeWrapper.style.display = 'none';
            card.classList.add('show');
            
            startHeartEffect();
            createHearts();
        }

        // 4. ฟังก์ชันเอฟเฟกต์หัวใจลอย
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            const icons = ['💖', '🎂', '💕', '🍰', '✨', '🧁', '⭐'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 12 + 18) + 'px';
            heart.style.animationDuration = Math.random() * 2 + 2.5 + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        function startHeartEffect() {
            setInterval(createHeart, 350);
        }

        function createHearts() {
            for(let i = 0; i < 18; i++) {
                setTimeout(createHeart, i * 90);
            }
        }
    </script>
</body>
</html>
