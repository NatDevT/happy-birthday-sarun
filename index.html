<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎂</title>
  <style>
    :root {
      --bg-color: #ffeaa7;
      --card-bg: #ffffff;
      --primary: #ff7675;
      --accent: #fd79a8;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      font-family: 'Sukhumvit Set', 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2d3436;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      margin-bottom: 20px;
    }

    h1 { color: var(--primary); margin-bottom: 5px; }
    p { color: #636e72; }

    /* --- 1. Cake & Candle Section --- */
    .cake-container {
      position: relative;
      margin: 30px auto 10px;
      width: 120px;
      height: 100px;
      background: #fab1a0;
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 -15px 0 #e17055;
    }
    .candle {
      width: 12px;
      height: 35px;
      background: #74b9ff;
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }
    .flame {
      width: 14px;
      height: 20px;
      background: #ffce54;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      box-shadow: 0 0 10px #ffce54;
      animation: flicker 0.6s infinite alternate;
    }
    .flame.off {
      display: none;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.1); }
    }

    /* --- 2. Wish Input --- */
    input[type="text"] {
      width: 80%;
      padding: 10px;
      border: 2px solid #dfe6e9;
      border-radius: 10px;
      margin-top: 10px;
      outline: none;
    }
    button.btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: 0.2s;
    }
    button.btn:hover { background: #e84393; }

    /* --- 3. Gift Box --- */
    .gift-box {
      font-size: 50px;
      cursor: pointer;
      transition: transform 0.3s;
      display: inline-block;
    }
    .gift-box:hover { transform: scale(1.1); }
    .gift-content {
      display: none;
      background: #ffeaa7;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }

    /* --- 4. Slideshow --- */
    .slideshow-container {
      position: relative;
      max-width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 15px;
      margin-top: 15px;
    }
    .slide {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- 5. Interactive Love Question --- */
    .love-section {
      position: relative;
      height: 120px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    #no-btn {
      position: absolute;
      background: #b2bec3;
    }
  </style>
</head>
<body>

  <!-- เพลงประกอบ (เปลี่ยนไฟล์ mp3 ตรง src ได้ครับ) -->
  <audio id="bgm" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>Happy Birthday! 💖</h1>
    <p>กดที่เปลวไฟเพื่อดับเทียนเป่าเค้กนะ!</p>

    <!-- 1. Cake & Candle -->
    <div class="cake-container">
      <div class="candle">
        <div class="flame" id="flame" onclick="blowCandle()"></div>
      </div>
    </div>
    <p id="cake-msg" style="font-weight: bold; color: var(--accent);"></p>

    <!-- 2. Wish Box -->
    <div style="margin-top: 20px;">
      <p>✨ อธิษฐานขอพรวันเกิดตรงนี้สิ:</p>
      <input type="text" id="wishInput" placeholder="พิมพ์คำขอพรของคุณ...">
      <br>
      <button class="btn" onclick="sendWish()">ส่งคำขอพร 🎈</button>
      <p id="wishResult" style="color: #00b894;"></p>
    </div>
  </div>

  <div class="container">
    <!-- 3. Gift Box -->
    <h3>🎁 มีของขวัญมาให้ ลองกดเปิดสิ!</h3>
    <div class="gift-box" onclick="openGift()">🎁</div>
    <div class="gift-content" id="giftContent">
      🎉 สุขสันต์วันเกิดนะ! ขอให้มีความสุขมากๆ สุขภาพแข็งแรง น่ารักแบบนี้ตลอดไปเลยนะ ❤️
    </div>
  </div>

  <div class="container">
    <!-- 4. Photo/Video Slideshow -->
    <h3>📸 ความทรงจำของเรา</h3>
    <div class="slideshow-container">
      <!-- เปลี่ยน src เป็นรูปภาพหรือวิดีโอของคุณได้เลย -->
      <img class="slide" src="https://picsum.photos/400/300?random=1" alt="รูป1">
      <img class="slide" src="https://picsum.photos/400/300?random=2" alt="รูป2">
      <!-- ตัวอย่างวิดีโอ (ถ้าต้องการใช้) -->
      <!-- <video class="slide" src="your-video.mp4" autoplay loop muted></video> -->
    </div>
  </div>

  <div class="container love-section">
    <!-- 5. Love Question -->
    <h3>รักเค้าไหม? 🥺</h3>
    <div class="btn-group">
      <button class="btn" onclick="acceptLove()">รักที่สุด ❤️</button>
      <button class="btn" id="no-btn" onmouseover="moveNoButton()">ไม่รัก 😜</button>
    </div>
  </div>

  <script>
    // 1. Blow Candle
    function blowCandle() {
      document.getElementById('flame').classList.add('off');
      document.getElementById('cake-msg').innerText = "🥳 เพี้ยง! ขอให้คำอธิษฐานเป็นจริงนะ!";
      // เล่นเพลงเมื่อกดเป่าเทียน
      var audio = document.getElementById("bgm");
      audio.play();
    }

    // 2. Wish Input
    function sendWish() {
      var wish = document.getElementById('wishInput').value;
      if (wish.trim() !== "") {
        document.getElementById('wishResult').innerText = "เก็บคำขอพร: \"" + wish + "\" ไว้ให้แล้วนะ 🌟";
        document.getElementById('wishInput').value = "";
      }
    }

    // 3. Open Gift
    function openGift() {
      var content = document.getElementById('giftContent');
      if (content.style.display === "none" || content.style.display === "") {
        content.style.display = "block";
      } else {
        content.style.display = "none";
      }
    }

    // 4. Slideshow
    let slideIndex = 0;
    showSlides();

    function showSlides() {
      let i;
      let slides = document.getElementsByClassName("slide");
      for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
      }
      slideIndex++;
      if (slideIndex > slides.length) {slideIndex = 1}    
      slides[slideIndex-1].style.display = "block";  
      setTimeout(showSlides, 3000); // เปลี่ยนรูปทุกๆ 3 วินาที
    }

    // 5. Runaway No Button
    function moveNoButton() {
      var btn = document.getElementById('no-btn');
      var x = Math.random() * (window.innerWidth - 100);
      var y = Math.random() * (window.innerHeight - 50);
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    function acceptLove() {
      alert("เย้! เค้ารักเธอเหมือนกันนะ 🥰❤️");
    }
  </script>
</body>
</html>
